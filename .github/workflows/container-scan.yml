name: Container Scan

# Builds the two images the deployment actually ships (backend/Dockerfile, frontend/Dockerfile, as in
# docker-compose-build.yml) and scans them with Trivy. Gate: zero CRITICAL findings; HIGH findings are
# reported to Code scanning but do not fail the build yet (tightened once the baseline is clean).
# Results are uploaded as SARIF so they appear in the Security tab next to CodeQL default setup.

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/poetry.lock"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/container-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/poetry.lock"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC: new advisories against unchanged images
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: sanadcom-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy scan, report CRITICAL and HIGH (SARIF for Code scanning)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sanadcom-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Gate, zero CRITICAL (fixed) vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sanadcom-${{ matrix.image }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
