name: Constitutional Compliance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  constitutional-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker/test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run constitutional compliance checker
        run: python scripts/check_constitutional_compliance.py

      - name: Run repository hygiene gate (no dumps, backups, keys or oversized binaries)
        run: python scripts/check_repo_hygiene.py

      - name: Run licence boundary gate (community code must not import enterprise code)
        run: python scripts/check_enterprise_isolation.py

      - name: Run gate self-tests
        run: python -m pytest -q scripts/tests

      - name: Run knowledge constitution kernel tests
        run: PYTHONPATH=backend python -m pytest -q backend/knowledge_constitution/tests

      - name: Run governance constitution tests
        run: PYTHONPATH=backend python -m pytest -q backend/governance_constitution/tests

      - name: Run Arabic corpus tool tests (S1-S4; integration with NABT/Alghanem/Mashru is skipped here)
        run: python -m pytest -q tools/arabic_corpus/tests
